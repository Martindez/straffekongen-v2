<!doctype html><html lang="nn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b2042"><title>STRAFFEKONGEN V6 ⚽</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><header><span class="crown">👑</span><h1>STRAFFEKONGEN <small>V6</small></h1><button id="sound" class="small" aria-label="Slå lyd av eller på">🔊</button></header><p id="assetWarning" hidden role="alert" class="asset-warning"></p><section id="menu" class="panel"><img class="hero" src="assets/menu-v5.jpg" alt="Straffekongen med fotballkeeper"><h2>⚽ Kven skal spele?</h2><p>Vel drakta til skyttaren. Den andre drakta blir keeperen si!</p><div class="kits"><button class="kit selected" data-team="no"><b>🇳🇴 NOREG</b><span>Raud drakt</span></button><button class="kit" data-team="cd"><b>🇨🇩 KONGO</b><span>Blå drakt</span></button></div><button id="start" class="primary">▶ SPEL STRAFFESPARK!</button><p class="hint">5 straffer · Sveip frå ballen · Middels keeper</p></section><section id="game" hidden><div class="scorebar"><span id="teams">🇳🇴 Noreg mot 🇨🇩 Kongo</span><strong id="score">⚽ 0 / 5</strong></div><div id="fieldWrap"><canvas id="field" width="900" height="1200" aria-label="Fotballbane med keeper og ball"></canvas><div id="banner" aria-live="polite"></div></div><p id="instruction">👆 Dra fingeren frå ballen og opp mot målet!</p><div class="actions"><button id="reset" class="secondary">↻ Start på nytt</button><button id="back" class="secondary">⌂ Meny</button></div></section><section id="finish" class="panel" hidden><div class="trophy">🏆</div><h2>RUNDE FERDIG!</h2><div id="finalScore" class="bigscore">0 av 5 mål!</div><p id="finalMessage"></p><button id="again" class="primary">↻ SPEL IGJEN</button><button id="finishMenu" class="secondary">⌂ TIL MENY</button></section><footer>Laga for små fotballheltar ⚽</footer></main><script src="script.js"></script></body></html>
